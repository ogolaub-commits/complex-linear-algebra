const R=String.raw;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const num=x=>String(Math.round(x*1e6)/1e6);

function mcq(prompt,correct,distractors,explain,extra){
  const seen=new Set([correct]),ds=[];
  for(const d of distractors){ if(d==null||seen.has(d)) continue; seen.add(d); ds.push(d); if(ds.length===3) break; }
  const spills=['None of these','Cannot be determined','Not enough information'];
  for(let i=0;ds.length<3;i++){ const s=spills[i%spills.length]; if(!seen.has(s)){ seen.add(s); ds.push(s); } }
  const options=shuffle([correct,...ds]);
  return Object.assign({type:'mcq',prompt,options,accept:[options.indexOf(correct)],explain},extra||{});
}
function quad(s,p){
  let t='x^{2}';
  if(s) t+=(s<0?'-':'+')+(Math.abs(s)===1?'':Math.abs(s))+'x';
  if(p) t+=(p<0?'-':'+')+Math.abs(p);
  return t;
}
function quadFull(A,B,C){
  let t=(A===1?'':A)+'x^{2}';
  if(B) t+=(B<0?'-':'+')+(Math.abs(B)===1?'':Math.abs(B))+'x';
  if(C) t+=(C<0?'-':'+')+Math.abs(C);
  return t;
}
function cn(a,b){
  if(b===0) return String(a);
  const ab=Math.abs(b), bp=(ab===1?'':ab)+'i';
  if(a===0) return (b<0?'-':'')+bp;
  return String(a)+(b<0?'-':'+')+bp;
}
const fac=(a,b)=>`(x${sgn2(a)}${Math.abs(a)})(x${sgn2(b)}${Math.abs(b)})`;

/* ---------------- Leg 1: the algebra workshop ---------------- */

/* ---- vector / matrix helpers ---- */
const vr=n=>Array.from({length:n},()=>rnd(-6,6));
const nz=n=>{let a;do{a=vr(n);}while(a.every(x=>!x));return a;};
const add=(a,b)=>a.map((x,i)=>x+b[i]);
const sub=(a,b)=>a.map((x,i)=>x-b[i]);
const scl=(k,a)=>a.map(x=>k*x);
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vmag=a=>Math.sqrt(dot(a,a));
const pmat=a=>R`\begin{pmatrix}`+a.map(String).join(R`\\`)+R`\end{pmatrix}`;
const vstr=a=>R`\left(`+a.map(String).join(R`,\ `)+R`\right)`;
const mp=M=>R`\begin{pmatrix}`+M.map(r=>r.map(String).join('&')).join(R`\\`)+R`\end{pmatrix}`;
const flat=(M)=>M.map(r=>r.map(x=>num(x)));

function mcq(prompt,correct,distractors,explain,extra){
  const seen=new Set([correct]),ds=[];
  for(const d of distractors){ if(d==null||seen.has(d)) continue; seen.add(d); ds.push(d); if(ds.length===3) break; }
  const spills=['None of these','Cannot be determined','Not enough information'];
  for(let i=0;ds.length<3;i++){ const sp=spills[i%spills.length]; if(!seen.has(sp)){ seen.add(sp); ds.push(sp); } }
  const options=shuffle([correct,...ds]);
  return Object.assign({type:'mcq',prompt,options,accept:[options.indexOf(correct)],explain},extra||{});
}

/* ---------------- Unit 1: Vector algebra ---------------- */

function qTriple(){

function qSym(){

     m(R`\frac{x+`+P[0]+R`}{`+d[0]+R`}=\frac{y+`+P[1]+R`}{`+d[1]+R`}=\frac{z+`+P[2]+R`}{`+d[2]+R`}`),
     m(R`\frac{x-(`+P[0]+R`)}{`+Q[0]+R`}=\frac{y-(`+P[1]+R`)}{`+Q[1]+R`}=\frac{z-(`+P[2]+R`)}{`+Q[2]+R`}`)],

  const n=nz(3),a=vr(3),K=n[0]*a[0]+n[1]*a[1]+n[2]*a[2];

/* ---------------- Unit 4: Matrix algebra ---------------- */
function qMatMul(){
  const A=[0,1].map(()=>[rnd(-4,4),rnd(-4,4)]),B=[0,1].map(()=>[rnd(-4,4),rnd(-4,4)]);
  const C=[0,1].map(i=>[0,1].map(j=>A[i][0]*B[0][j]+A[i][1]*B[1][j]));
  const bump=(i,j)=>{ const D=C.map(r=>r.slice()); D[i][j]+=1; return m(mp(flat(D))); };
  return mcq(R`Compute `+m(mp(A)+mp(B))+R`.`,
    m(mp(flat(C))),[bump(0,0),bump(0,1),bump(1,1)],
    R`Multiply rows of the first by columns of the second: `+m(mp(flat(C)))+R`.`);
}
function qDet2(){
  const a=rnd(-6,6),b=rnd(-6,6),c=rnd(-6,6),d=rnd(-6,6),det=a*d-b*c;
  if(det===0) return qDet2();
  return mcq(R`Find the determinant of `+m(R`\begin{pmatrix}`+a+'&'+b+R`\\`+c+'&'+d+R`\end{pmatrix}`)+R`.`,
    m(num(det)),[m(num(det+1)),m(num(det-1)),m(num(-det))],
    R``+m(R`\det=ad-bc=`+a+'\\cdot'+d+'-'+b+'\\cdot'+c+'='+det)+R`.`);
}
function qDet3(){
  const M=[0,1,2].map(()=>[rnd(-4,4),rnd(-4,4),rnd(-4,4)]);
  const det=M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
  return {type:'num',prompt:R`Find the determinant of `+m(mp(M))+R`.`,
    unit:'',answer:det,explain:R`Expand along the first row: `+m(R`\det=`+det)+R`.`};
}
function qInv2(){
  const a=rnd(-4,4)||1,b=rnd(-4,4),c=rnd(-4,4),d=rnd(-4,4)||1,det=a*d-b*c;
  if(!det) return qInv2();
  const inv=[[d/det,-b/det],[-c/det,a/det]];
  const correct=m(mp(flat(inv))), seen=new Set([correct]), ds=[];
  const add=M=>{ const s=m(mp(flat(M))); if(!seen.has(s)){ seen.add(s); ds.push(s); } };
  add([[d,-b],[-c,a]]);
  add([[inv[0][0],inv[1][0]],[inv[0][1],inv[1][1]]]);
  add(inv.map(r=>r.map(x=>-x)));
  let k=1; while(ds.length<3){ const D=inv.map(r=>r.slice()); D[0][0]+=k; add(D); k++; }
  return mcq(R`Find the inverse of `+m(mp([[a,b],[c,d]]))+R`.`,
    correct,ds,
    R``+m(R`A^{-1}=\frac{1}{ad-bc}`+R`\begin{pmatrix}`+d+'&'+(-b)+R`\\`+(-c)+'&'+a+R`\end{pmatrix}`)+R`, with `+m('ad-bc='+det)+R`.`);
}
function qSingular(){
  const sing=()=>{const a=rnd(-3,3)||1,b=rnd(-3,3)||1,k=pick([-2,-1,2,3]);return [[a,b],[k*a,k*b]];};
  const reg=()=>{const a=rnd(1,4),b=rnd(1,4),c=rnd(1,4),d=rnd(1,4);return (a*d-b*c===0)?reg():[[a,b],[c,d]];};
  const S=sing(),N1=reg(),N2=reg();
  return mcq(R`Which matrix is singular (has no inverse)?`,
    m(mp(S)),[m(mp(N1)),m(mp(N2)),m(mp(N1.map(r=>r.map(x=>-x))))],
    R`Singular means `+m(R`\det=0`)+R`. Here `+m(mp(S))+R` has `+m(R`\det=0`)+R`.`);
}


/* ---------------- Extra: Cartesian forms and row reduction ---------------- */
function linN(coefs,vars){
  let out='';
  coefs.forEach((c,i)=>{ if(!c) return; out+=(c<0?'-':'+')+(Math.abs(c)===1?'':Math.abs(c))+vars[i]; });
  return out.replace(/^\+/,'')||'0';
}
function det3(M){
  return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
}
function rank3(M){
  const A=M.map(r=>r.slice()); let r=0;
  for(let c=0;c<3&&r<3;c++){
    let piv=r; for(let i=r;i<3;i++) if(Math.abs(A[i][c])>Math.abs(A[piv][c])) piv=i;
    if(Math.abs(A[piv][c])<1e-9) continue;
    [A[r],A[piv]]=[A[piv],A[r]];
    const pv=A[r][c]; for(let j=c;j<3;j++) A[r][j]/=pv;
    for(let i=0;i<3;i++) if(i!==r){ const f=A[i][c]; for(let j=c;j<3;j++) A[i][j]-=f*A[r][j]; }
    r++;
  }
  return r;
}
function qCartLine(){
  const P=[rnd(-4,4),rnd(-4,4)];
  const p=pick([-4,-3,-2,-1,1,2,3,4]); let q; do{ q=pick([-4,-3,-2,-1,1,2,3,4]); }while(q===p);
  const c=q*P[0]-p*P[1];
  const cor=linN([q,-p],['x','y'])+'='+c;
  return mcq(R`A line in the plane passes through `+m(vstr(P))+R` with direction `+m(pmat([p,q]))+R`. Find its Cartesian equation.`,
    m(cor),
    [m(linN([q,p],['x','y'])+'='+c),m(linN([p,-q],['x','y'])+'='+c),m(linN([q,-p],['x','y'])+'='+(c+1))],
    R`The parametric form is `+m(R`x=${P[0]}+${p}t,\quad y=${P[1]}+${q}t`)+R`. Eliminating `+m('t')+R` gives `+m(R`q(x-${P[0]})=p(y-${P[1]})`)+R`, that is `+m(cor)+R`.`);
}
function qPlane3(){
  let P,Q,Rr,n;
  do{ P=vr(3); Q=vr(3); Rr=vr(3); n=cross(sub(Q,P),sub(Rr,P)); }while(n.every(x=>!x));
  const d=dot(n,P), lhs=linN(n,['x','y','z']);
  return mcq(R`Find the Cartesian equation of the plane through `+m(vstr(P))+R`, `+m(vstr(Q))+R` and `+m(vstr(Rr))+R`.`,
    m(lhs+'='+d),
    [m(lhs+'='+(d+1)),m(lhs+'='+(d-1)),m(lhs+'='+(d+2))],
    R`Two directions are `+m(R`\overrightarrow{PQ}=`+pmat(sub(Q,P)))+R` and `+m(R`\overrightarrow{PR}=`+pmat(sub(Rr,P)))+R`. Their cross product is the normal `+m(pmat(n))+R`, and `+m(R`\mathbf{n}\cdot\mathbf{r}=\mathbf{n}\cdot\mathbf{p}`)+R` gives `+m(lhs+'='+d)+R`.`);
}
function qRowOp(){
  const A=[0,1,2].map(()=>[rnd(-4,4),rnd(-4,4),rnd(-4,4)]);
  const k=pick([-3,-2,-1,1,2,3]);
  const mode=pick(['r2','r3','swap']);
  const B=A.map(r=>r.slice());
  let lab;
  if(mode==='r2'){ for(let j=0;j<3;j++) B[1][j]=A[1][j]+k*A[0][j]; lab=R`R_2\to R_2`+(k===1?'+':k===-1?'-':(k<0?'-':'+')+Math.abs(k))+R`R_1`; }
  else if(mode==='r3'){ for(let j=0;j<3;j++) B[2][j]=A[2][j]+k*A[0][j]; lab=R`R_3\to R_3`+(k===1?'+':k===-1?'-':(k<0?'-':'+')+Math.abs(k))+R`R_1`; }
  else { B[1]=A[2].slice(); B[2]=A[1].slice(); lab=R`R_2\leftrightarrow R_3`; }
  const bump=(i,j)=>{ const D=B.map(r=>r.slice()); D[i][j]+=1; return m(mp(D)); };
  return mcq(R`Apply the elementary row operation `+m(lab)+R` to `+m(mp(A))+R`. Which matrix results?`,
    m(mp(B)),
    [m(mp(A)),bump(1,0),bump(2,1)],
    R`Perform the operation exactly on the stated row, leaving the other rows unchanged. This gives `+m(mp(B))+R`.`);
}
function qRank(){
  let M,rk;
  const mode=pick(['one','two','three']);
  if(mode==='one'){ const r=nz(3); M=[r,scl(pick([2,-2,3]),r),scl(pick([-3,2,1]),r)]; }
  else if(mode==='two'){ let a,b; do{ a=nz(3); b=nz(3); }while(cross(a,b).every(x=>!x)); M=[a,b,add(a,b)]; }
  else { do{ M=[nz(3),nz(3),nz(3)]; }while(rank3(M)<3); }
  rk=rank3(M);
  return mcq(R`Find the rank of `+m(mp(M))+R`.`,
    m(String(rk)),[m('0'),m('1'),m('2'),m('3')].filter(x=>x!==m(String(rk))),
    R`Row-reduce the matrix. The rank is the number of non-zero rows in echelon form (the number of independent rows), here `+m(String(rk))+R`.`);
}
function qSolve2(){
  let x,y,a,b,c,d;
  do{ x=rnd(-4,4); y=rnd(-4,4); a=pick([1,2,3]); b=pick([1,2,3,-1]); c=pick([1,2,3]); d=pick([1,2,3,-1]); }
  while(a*d-b*c===0||x===0||y===0||x===y||x===-y);
  const e=a*x+b*y,f=c*x+d*y;
  return mcq(R`Solve the system `+m(R`\begin{cases}${linN([a,b],['x','y'])}=${e}\\ ${linN([c,d],['x','y'])}=${f}\end{cases}`)+R`.`,
    m(R`x=${x},\ y=${y}`),
    [m(R`x=${y},\ y=${x}`),m(R`x=${-x},\ y=${y}`),m(R`x=${x},\ y=${-y}`)],
    R`Eliminate one variable. Substituting `+m(R`x=${x},\ y=${y}`)+R` satisfies both equations.`);
}
function qSolve3(){
  let A,x,y,z,rhs;
  do{
    x=rnd(-3,3); y=rnd(-3,3); z=rnd(-3,3);
    A=[0,1,2].map(()=>[rnd(-2,2),rnd(-2,2),rnd(-2,2)]);
    rhs=[dot(A[0],[x,y,z]),dot(A[1],[x,y,z]),dot(A[2],[x,y,z])];
  }while(det3(A)===0||x===0||y===0||z===0||new Set([x,y,z]).size<3);
  const sys=R`\begin{cases}${linN(A[0],['x','y','z'])}=${rhs[0]}\\ ${linN(A[1],['x','y','z'])}=${rhs[1]}\\ ${linN(A[2],['x','y','z'])}=${rhs[2]}\end{cases}`;
  return mcq(R`Solve the system `+m(sys)+R`.`,
    m(R`x=${x},\ y=${y},\ z=${z}`),
    [m(R`x=${y},\ y=${z},\ z=${x}`),m(R`x=${-x},\ y=${y},\ z=${z}`),m(R`x=${x},\ y=${-y},\ z=${-z}`)],
    R`Row-reduce the augmented matrix. The solution is `+m(R`x=${x},\ y=${y},\ z=${z}`)+R`.`);
}
function qInv3(){
  const a=pick([-3,-2,-1,1,2,3]),b=pick([-3,-2,-1,1,2,3]),c=pick([-3,-2,-1,1,2,3]);
  const L=[[1,0,0],[a,1,0],[b,c,1]];
  const Inv=[[1,0,0],[-a,1,0],[a*c-b,-c,1]];
  const bump=(i,j)=>{ const D=Inv.map(r=>r.slice()); D[i][j]+=1; return m(mp(D)); };
  return mcq(R`Use Gauss-Jordan elimination to find the inverse of `+m(mp(L))+R`.`,
    m(mp(Inv)),
    [m(mp(L)),m(mp(Inv.map(r=>r.map(v=>-v)))),bump(2,0)],
    R`Form `+m(R`[A\mid I]`)+R` and row-reduce until the left block is `+m('I')+R`. The right block is `+m(mp(Inv))+R`.`);
}

  S=null; CUR_PROVE=Math.floor(Math.random()*PROVE.length); const p=PROVE[CUR_PROVE];
  app.innerHTML=`<main class="prove">
    <div class="bar"><button class="link" data-act="chart">Back to chart</button><span class="tally">Prove it \u00b7 write your working by hand</span></div>
    <h1 style="font-family:var(--serif);font-style:italic;font-weight:400">Prove it</h1>
    <p class="lede">Write each step of your solution on the pad, then tap Get feedback. The marker reads your handwriting and tells you how it went. Three significant figures where numbers are needed.</p>
    <p class="prompt">${esc(p.q)}</p>
    <div class="padwrap"><canvas id="pad" width="800" height="320" aria-label="Handwriting pad"></canvas><span class="padtag">write here</span></div>
    <div class="actions" style="margin-top:.7rem"><button class="secondary" id="pundo" type="button">\u21b6 Undo</button><button class="secondary" id="pclear" type="button">Clear</button><button class="primary" id="pcheck" data-act="pcheck">Get feedback</button></div>
    <div id="pfb"></div>
  </main>`;
  initPad();
  settle();
}
function initPad(){
  PAD=document.getElementById('pad'); if(!PAD) return;
  PCTX=PAD.getContext('2d'); PCTX.lineWidth=3; PCTX.lineCap='round'; PCTX.lineJoin='round'; PCTX.strokeStyle='#101a3a';
  PHIST=[]; PDRAWING=false; PINKD=false;
  const pos=e=>{ const r=PAD.getBoundingClientRect(); return {x:(e.clientX-r.left)*(PAD.width/r.width), y:(e.clientY-r.top)*(PAD.height/r.height)}; };
  PAD.addEventListener('pointerdown',e=>{ PDRAWING=true; PINKD=true; try{ PHIST.push(PCTX.getImageData(0,0,PAD.width,PAD.height)); if(PHIST.length>25) PHIST.shift(); }catch(_){} const p=pos(e); PCTX.beginPath(); PCTX.moveTo(p.x,p.y); try{PAD.setPointerCapture(e.pointerId);}catch(_){} });
  PAD.addEventListener('pointermove',e=>{ if(!PDRAWING) return; const p=pos(e); PCTX.lineTo(p.x,p.y); PCTX.stroke(); });
  PAD.addEventListener('pointerup',()=>PDRAWING=false);
  PAD.addEventListener('pointercancel',()=>PDRAWING=false);
  document.getElementById('pclear').onclick=()=>{ PCTX.clearRect(0,0,PAD.width,PAD.height); PHIST=[]; PINKD=false; SFX.click(); };
  document.getElementById('pundo').onclick=()=>{ if(PHIST.length){ PCTX.putImageData(PHIST.pop(),0,0); PINKD=PHIST.length>0; SFX.click(); } };
}
async function proveCheck(){
  const btn=document.getElementById('pcheck');
  if(!PAD || !PINKD){ praise('Write your working first.'); return; }
  let img=null; try{ img=PAD.toDataURL('image/png'); }catch(_){}
  if(!img){ praise('Could not read the pad.'); return; }
  btn.disabled=true; btn.textContent='Marking\u2026';
  const p=PROVE[CUR_PROVE];
  try{
    const res=await fetch('/practice/check',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({image:img,question:p.q.replace(/\\/g,''),expected:p.ans})});
    const d=await res.json();
    const fb=document.getElementById('pfb');
    if(!d.ok){ fb.innerHTML='<div class="fb bad"><h2>Could not mark</h2><p>'+esc(d.error||'')+'</p></div>'; }
    else{
      const ok=d.verdict==='correct';
      fb.innerHTML='<div class="fb '+(ok?'good':'bad')+'"><h2>'+(ok?'Correct':(d.verdict==='partial'?'Nearly there':'Not quite'))+'</h2><div class="why"><div class="logbook"><b>What the marker read:</b> '+esc(d.transcription||'')+'</div><p>'+esc(d.feedback||'')+'</p></div></div>';
      if(ok){ SFX.correct(); confetti(90); praise(pick(PRAISE)); } else SFX.wrong();
      fb.scrollIntoView&&fb.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }catch(e){ document.getElementById('pfb').innerHTML='<div class="fb bad"><h2>Offline</h2><p>AI marking works on the StudyBuddy site, not offline.</p></div>'; }
  btn.disabled=false; btn.textContent='Get feedback';
}

    seen[s.leg]=(seen[s.leg]||0)+1;

    course+=`<path class="course ${done?'':'todo'}" d="M${POS[i-1].x},${POS[i-1].y}L${POS[i].x},${POS[i].y}"/>`; } });
  const wps=STATIONS.map((s,i)=>{ const p=POS[i],done=(progress.stars[s.id]||0)>0;

/* ---------- plots ---------- */
let PLOT=null;
function plotSVG(o){
  const W=600,H=250,L=38,Rt=14,Tp=14,B=30,n=120,T=o.T||6;
  const ys=[]; for(let i=0;i<=n;i++) ys.push(resp(o.b,o.c,T*i/n));
  let hi=1.15,lo=-1.05,ticks=[-1,-0.5,0,0.5,1];
  if(!o.dots){ const mx=Math.max(1,...ys.map(Math.abs)); hi=mx*1.12; lo=Math.min(...ys)<-0.05?-hi:-0.12*hi; const tk=mx<=1.3?1:Math.round(mx); ticks=lo<-0.5*hi?[-tk,0,tk]:[0,tk]; }
  const px=t=>L+(W-L-Rt)*t/T, py=v=>Tp+(H-Tp-B)*(hi-v)/(hi-lo);
  const path=(b,c)=>{ let d=''; for(let i=0;i<=n;i++){ const t=T*i/n; d+=(i?'L':'M')+px(t).toFixed(1)+','+py(resp(b,c,t)).toFixed(1); } return d; };
  let g='';
  ticks.forEach(v=>{ g+=`<line class="${v===0?'ax':'gr'}" x1="${L}" x2="${W-Rt}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}"/><text x="${L-6}" y="${(py(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`; });
  for(let t=0;t<=T;t++) g+=`<line class="ax" x1="${px(t).toFixed(1)}" x2="${px(t).toFixed(1)}" y1="${H-B}" y2="${H-B+4}"/><text x="${px(t).toFixed(1)}" y="${H-B+17}" text-anchor="middle">${t}</text>`;
  g+=`<line class="ax" x1="${L}" x2="${L}" y1="${Tp}" y2="${H-B}"/><line class="ax" x1="${L}" x2="${W-Rt}" y1="${H-B}" y2="${H-B}"/><text x="${W-Rt}" y="${H-4}" text-anchor="end">t, seconds</text><text x="${L+6}" y="${Tp+10}">x</text>`;
  let body;
  if(o.dots){ let dots=''; for(let i=0;i<=30;i++){ const t=T*i/30; dots+=`<circle class="data" cx="${px(t).toFixed(1)}" cy="${py(resp(o.b,o.c,t)).toFixed(1)}" r="3"/>`; }
    PLOT={path};
    body=`<path class="truth" id="truth" d="" /><path class="mine" id="mine" d="${path(o.ub,o.uc)}"/>${dots}`; }
  else body=`<path class="trace" d="${path(o.b,o.c)}"/>`;
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.dots?'Logged data points with your adjustable curve':'Logged trace of x against time'}">${g}${body}</svg>`;
}

/* ---------- station ---------- */
function startStation(id){
  const st=STATIONS.find(s=>s.id===id); if(!st) return;
  S={st,qs:st.round(),i:0,marks:[],score:0,streak:0,answered:false,sel:{},ub:0,uc:1};
  renderQ(); window.scrollTo(0,0);
}
function pipsHTML(){
  return `<div class="pips">${S.qs.map((q,i)=>`<span class="pip ${i<S.marks.length?(S.marks[i]?'ok':'no'):(i===S.i?'now':'')}"></span>`).join('')}<p class="count">Problem ${Math.min(S.i+1,S.qs.length)} of ${S.qs.length}</p></div>`;
}
function renderQ(){
  const q=S.qs[S.i]; S.answered=false; S.sel={}; S.ub=0; S.uc=1;
  let body='';
  if(q.type==='mcq'){
    body=(q.tex?`<div class="eq">\\[${q.tex}\\]</div>`:'')+(q.note?`<p class="note">${q.note}</p>`:'')+(q.plot?plotSVG(q.plot):'')+
      `<div class="opts ${q.cols===2?'two':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${i+1}</span><span class="otx">${texOpt(o)}</span></button>`).join('')}</div>`;
  } else if(q.type==='panel'){
    body=`<div class="eq">\\[${q.tex}\\]</div>`+q.rows.map((r,ri)=>`<div class="prow"><span class="plabel">${r.label}</span><div class="seg" role="group" aria-label="${r.label}">${r.opts.map((o,oi)=>`<button class="segb" data-r="${ri}" data-o="${oi}" aria-pressed="false">${o}</button>`).join('')}</div></div>`).join('')+
      `<div class="after"><button class="primary" data-act="checkpanel" disabled>Check answer</button></div>`;
  } else if(q.type==='num'){
    body=`<div class="numrow"><label class="vh" for="ans">Your answer${q.unit?' in '+q.unit:''}</label><input id="ans" inputmode="decimal" autocomplete="off" placeholder="Your answer"><span class="unit">${q.unit||''}</span><button class="primary" data-act="checknum">Check answer</button></div><p class="hint">${q.unit?'Give three significant figures.':'An exact value is fine, or three significant figures.'}</p><p class="err" id="numerr" hidden>Enter a number, for example 12.5.</p>`;
  } else if(q.type==='tune'){
    body=plotSVG({b:q.b,c:q.c,T:6,dots:true,ub:S.ub,uc:S.uc})+
      `<div class="sliders"><div class="sl"><label for="sb">Damping b</label><input type="range" id="sb" min="0" max="10" step="0.5" value="${S.ub}"><output id="ob">${S.ub}</output></div>
       <div class="sl"><label for="sc">Stiffness c</label><input type="range" id="sc" min="1" max="30" step="1" value="${S.uc}"><output id="oc">${S.uc}</output></div></div>
       <p class="note">Damping <b>b</b> is the water resistance (drag); stiffness <b>c</b> is the hull buoyancy. Fit your curve to the logged data.</p>
       <div class="readout" id="readout" aria-live="polite"></div>
       <button class="primary" data-act="checktune">Lock in b and c</button>`;
  }
  app.innerHTML=`<main class="station">
    <div class="bar"><button class="link" data-act="chart">Back to chart</button><span class="tally">Score <b id="score">${S.score}</b> · Combo <b id="speed">${streakLabel(S.streak)}</b></span><button class="link" id="lamute" data-act="mute">${MUTED?'🔇 Muted':'🔊 Sound'}</button></div>
    <div class="where"><span class="place">Unit ${S.st.leg} · Node ${STATIONS.indexOf(S.st)+1} of ${STATIONS.length} · Adaptive: ${LVNAME[lvl(S.st.id)-1]}</span><h1>${S.st.name}</h1></div>
    ${toolkitHTML(S.st)}
    ${lessonHTML(S.st.id)}
    ${ytHTML(S.st.id)}
    <div id="pips">${pipsHTML()}</div>
    <section class="q"><p class="prompt">${esc(q.prompt)}</p>${body}</section>
    <div id="fb"></div>
  </main>`;
  if(q.type==='tune') updateTune();
  const mh=document.getElementById('miniholder'); if(mh) mh.innerHTML=miniArgand();
  attachLesson(S.st.id);
  settle();
  if(q.type==='num'){ const inp=document.getElementById('ans'); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') checkNum(); }); }
}
function updateTune(){
  const q=S.qs[S.i],info=rootInfo(S.ub,S.uc),g=gap(S.ub,S.uc,q.b,q.c);
  document.getElementById('mine').setAttribute('d',PLOT.path(S.ub,S.uc));
  document.getElementById('ob').textContent=S.ub; document.getElementById('oc').textContent=S.uc;
  document.getElementById('readout').innerHTML=`<p class="eqt">${eqText(S.ub,S.uc)}</p><p>b² − 4ac = ${String(info.d).replace('-','−')}, ${info.kind}: ${info.roots}</p><p class="gapline">Average gap between your curve and the data: ${g.toFixed(3)}</p>`;
}
function mark(ok,extra){
  const q=S.qs[S.i]; S.answered=true; S.marks.push(ok);
  let gain=0; if(ok){ S.streak++; gain=100+Math.min(80,20*(S.streak-1)); S.score+=gain; SFX.correct(); praise(pick(PRAISE)); } else { S.streak=0; SFX.wrong(); praise(pick(OOPS)); }
  saveProgress();
  const last=S.i===S.qs.length-1;
  document.getElementById('score').textContent=S.score;
  const sp=document.getElementById('speed'); if(sp) sp.textContent=streakLabel(S.streak);
  document.getElementById('pips').innerHTML=pipsHTML();
  const head=ok?`Correct <span class="gain">+${gain}${S.streak>1?`, ${S.streak} in a row`:''}</span>`:'Not quite';
  const why=ok?`<p>${esc(q.explain)}</p>`:`<div class="logbook"><b>Hint:</b> ${esc(q.explain)}</div>${extra?`<p>${esc(extra)}</p>`:''}`;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'good':'bad'}" role="status"><h2>${head}</h2><div class="why">${why}</div><button class="primary" data-act="next">${last?'See the result':'Next problem'}</button></div>`;
  settle();
  const nb=document.querySelector('[data-act="next"]'); if(nb) nb.focus({preventScroll:true});
  const fb=document.getElementById('fb'); if(fb.scrollIntoView) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function chooseOpt(i){
  const q=S.qs[S.i]; if(S.answered||q.type!=='mcq') return;
  const ok=q.accept.includes(i);
  document.querySelectorAll('.opt').forEach((b,bi)=>{ b.disabled=true;
    if(q.accept.includes(bi)) b.classList.add('right'); else if(bi===i) b.classList.add('wrong'); else b.classList.add('fade'); });
  mark(ok);
}
function checkPanel(){
  const q=S.qs[S.i]; if(S.answered) return; let all=true; const missed=[];
  q.rows.forEach((r,ri)=>{ const chosen=r.opts[S.sel[ri]],good=chosen===r.ans; if(!good){ all=false; missed.push(r.label.toLowerCase()); }
    document.querySelectorAll(`.segb[data-r="${ri}"]`).forEach((b,oi)=>{ b.disabled=true; if(r.opts[oi]===r.ans) b.classList.add('right'); else if(oi===S.sel[ri]) b.classList.add('wrong'); b.setAttribute('aria-pressed','false'); }); });
  document.querySelector('[data-act="checkpanel"]').hidden=true;
  mark(all,all?'':`Check the ${missed.join(' and the ')}: the right settings are marked in green.`);
}
function checkNum(){
  const q=S.qs[S.i]; if(S.answered) return;
  const inp=document.getElementById('ans'),v=parseFloat(inp.value.replace(/[,\s]/g,''));
  const err=document.getElementById('numerr');
  if(!isFinite(v)){ err.hidden=false; inp.focus(); return; }
  err.hidden=true; inp.disabled=true; document.querySelector('[data-act="checknum"]').disabled=true;
  const ok=Math.abs(v-q.answer)<=0.015*Math.abs(q.answer)+1e-9;
  mark(ok,ok?'':`The answer is about ${sig(q.answer)} ${q.unit}.`);
}
function checkTune(){
  const q=S.qs[S.i]; if(S.answered) return;
  const g=gap(S.ub,S.uc,q.b,q.c),ok=g<0.015;
  document.getElementById('sb').disabled=true; document.getElementById('sc').disabled=true; document.querySelector('[data-act="checktune"]').hidden=true;
  if(!ok) document.getElementById('truth').setAttribute('d',PLOT.path(q.b,q.c));
  const exact=S.ub===q.b&&S.uc===q.c;
  mark(ok,ok?(exact?'':'Your constants fit the data within tolerance.'):'The dashed green curve shows the fit you were looking for.');
}
function nextQ(){
  if(!S||!S.answered) return;
  if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0); } else renderResult();
}
function renderResult(){
  const st=S.st,raw=S.marks.filter(Boolean).length;
  const prevL=lvl(st.id),reach=reachFor(prevL),n=raw;
  const stars=n>=5?3:n===4?2:n>=reach?1:0;
  let newL=prevL; if(n>=5) newL=Math.min(3,prevL+1); else if(n<=2) newL=Math.max(1,prevL-1);
  const moved=newL>prevL?' Difficulty rising — Challenge next.':newL<prevL?' Switching to Foundation for support.':'';
  progress.level[st.id]=newL;
  const prev=progress.stars[st.id]||0;
  if(stars>prev) progress.stars[st.id]=stars;
  if(S.score>(progress.best[st.id]||0)) progress.best[st.id]=S.score;
  save();
  const idx=STATIONS.indexOf(st),nx=STATIONS[idx+1];
  const pips=`<div class="pips">${S.marks.map(k=>`<span class="pip ${k?'ok':'no'}"></span>`).join('')}</div>`;
  const msg=(stars===3?'A clean run.':stars===2?'One problem short of three stars.':stars===1?'Cleared, with room to tighten up.':`You need ${reach} right to clear this node.`)+moved;
  app.innerHTML=`<main class="result">
    <span class="place">Unit ${st.leg} · Node ${idx+1} of ${STATIONS.length} · ${st.place} · Adaptive: ${LVNAME[newL-1]}</span>
    <h1>${stars?'Node cleared':'Not there yet'}</h1>
    ${starsHTML(stars)}
    <p class="sum">${n} of ${S.qs.length} correct. Score ${S.score}${(progress.best[st.id]||0)>S.score?`, best ${progress.best[st.id]}`:''}. ${msg}</p>
    ${pips}
    <div class="actions">${stars&&nx?`<button class="primary" data-st="${nx.id}">Next node: ${nx.name}</button>`:''}<button class="${stars&&nx?'secondary':'primary'}" data-st="${st.id}">Try this node again</button><button class="secondary" data-act="chart">Back to chart</button></div>
  </main>`;
  if(stars>0){ celebrate(stars===3?'🏅':'◆', stars===3?'Three stars earned':'Node cleared', `${n} of ${S.qs.length} correct. ${st.name}.`); } else { SFX.wrong(); }
  progress.current=null; save();
  S=null; window.scrollTo(0,0);
  const first=app.querySelector('.actions button'); if(first) first.focus({preventScroll:true});
}

/* ---------- lesson videos (inline at the top of each waypoint) ---------- */
function lessonHTML(id){
  const list=VIDEOS[id]||[]; if(!list.length) return '';
  const first=list[0];
  const tabs=list.length>1?`<div class="wlist" role="tablist">${list.map((v,i)=>`<button class="wtab${i===0?' on':''}" data-v="${i}" role="tab">${v[1]}</button>`).join('')}</div>`:'';
  return `<section class="lesson" data-listlen="${list.length}">
    <div class="lessonhead"><span class="lessonlab">▶ Watch the lesson</span>${list.length>1?'<span class="lessonhint">pick a method</span>':''}</div>
    <video class="lessonvid" controls preload="metadata" playsinline aria-label="Worked-example lesson"><source src="la/${first[0].replace(/\.mp4$/,'.webm')}" type="video/webm"><source src="la/${first[0]}" type="video/mp4"><track kind="subtitles" srclang="en" label="English" src="la/${first[0].replace(/\.mp4$/,'.vtt')}" default></video>
    ${tabs}
    <p class="lessoncap">${first[1]}</p>
    <p class="lessonai">Lesson audio and visuals generated by AI.</p>
  </section>`;
}
function attachLesson(id){
  const list=VIDEOS[id]||[]; if(list.length<2) return;
  const sec=app.querySelector('.lesson'); if(!sec) return;
  const vid=sec.querySelector('.lessonvid'), cap=sec.querySelector('.lessoncap');
  sec.querySelectorAll('.wtab').forEach(b=>{ b.onclick=()=>{
    const i=Number(b.dataset.v);
    sec.querySelectorAll('.wtab').forEach(x=>x.classList.toggle('on',x===b));
    vid.pause(); vid.innerHTML=`<source src="la/${list[i][0].replace(/\.mp4$/,'.webm')}" type="video/webm"><source src="la/${list[i][0]}" type="video/mp4"><track kind="subtitles" srclang="en" label="English" src="la/${list[i][0].replace(/\.mp4$/,'.vtt')}" default>`; cap.textContent=list[i][1]; vid.load();
    SFX.tick();
  }; });
}
/* YouTube deeper dives — thumbnails first, iframe only on click (keeps the page light). */
function ytHTML(id){
  const list=YT[id]||[]; if(!list.length) return '';
  const items=list.map(v=>{ const id=v[0], title=v[1]; return `<button class="ytcard" data-yt="${id}" aria-label="Play: ${title}">
      <span class="ytthumb"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt=""></span>
      <span class="yttitle">${title}</span></button>`; }).join('');
  return `<details class="deeper"><summary>Deeper dive on YouTube<span class="ytcount">${list.length}</span></summary><div class="ytlist">${items}</div></details>`;
}
function closeYT(card){
  const f=card.querySelector('iframe'); if(f) f.src='about:blank';
  if(card.dataset.card) card.innerHTML=card.dataset.card;
  card.classList.remove('playing');
}
function openYT(btn){
  const id=btn.dataset.yt; if(!id) return;
  document.querySelectorAll('.ytcard.playing').forEach(closeYT);
  if(!btn.dataset.card) btn.dataset.card=btn.innerHTML;
  btn.classList.add('playing');
  btn.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  SFX.tick();
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-st],[data-act],.opt,.segb,.ytcard'); if(!t) return;
  if(t.dataset.st){ startStation(t.dataset.st); return; }
  if(t.classList.contains('ytcard')){ openYT(t); return; }
  if(t.classList.contains('opt')){ chooseOpt(Number(t.dataset.i)); return; }
  if(t.classList.contains('segb')){ if(S.answered) return; const r=t.dataset.r;
    document.querySelectorAll(`.segb[data-r="${r}"]`).forEach(b=>b.setAttribute('aria-pressed','false'));
    t.setAttribute('aria-pressed','true'); S.sel[r]=Number(t.dataset.o);
    document.querySelector('[data-act="checkpanel"]').disabled=Object.keys(S.sel).length<S.qs[S.i].rows.length; return; }
  const a=t.dataset.act;
  if(a==='chart'){ progress.current=null; save(); renderChart(); }
  else if(a==='prove') renderProve();
  else if(a==='pcheck') proveCheck();
  else if(a==='mute'){ MUTED=!MUTED; try{localStorage.setItem('la-mute',MUTED?'1':'0');}catch(e){} const mb=document.getElementById('lamute'); if(mb) mb.textContent=MUTED?'🔇 Muted':'🔊 Sound'; if(!MUTED) SFX.tick(); }
  else if(a==='next') nextQ();
  else if(a==='checkpanel') checkPanel();
  else if(a==='checknum') checkNum();
  else if(a==='checktune') checkTune();
  else if(a==='reset'){ if(t.dataset.sure){ progress={stars:{},best:{}}; save(); renderChart(); } else { t.dataset.sure='1'; t.textContent='Press again to clear all stars'; } }
});
app.addEventListener('input',e=>{
  if(!S||S.answered) return;
  if(e.target.id==='sb'){ S.ub=Number(e.target.value); updateTune(); }
  if(e.target.id==='sc'){ S.uc=Number(e.target.value); updateTune(); }
});
document.addEventListener('keydown',e=>{
  if(!S||S.answered||e.ctrlKey||e.metaKey||e.altKey) return;
  const q=S.qs[S.i]; if(q.type!=='mcq') return;
  if(e.target&&(e.target.tagName==='INPUT')) return;
  const k=Number(e.key); if(k>=1&&k<=q.options.length){ e.preventDefault(); chooseOpt(k-1); }
});
renderChart();
if(progress.current&&progress.current.st){ const pc=progress.current; startStation(pc.st); S.i=Math.min(pc.i||0,S.qs.length-1); S.marks=(pc.marks||[]).slice(0,S.i); S.score=pc.score||0; S.streak=pc.streak||0; renderQ(); }
</script>
</body>
</html>
